<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a class="brand" routerLink="/">Yahallo</a>
      <h2>{{ 'AUTH.FORGOT_TITLE' | translate }}</h2>
      <p>{{ 'AUTH.FORGOT_SUBTITLE' | translate }}</p>
    </div>
    <form (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label>{{ 'AUTH.EMAIL' | translate }}</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" class="form-control" [(ngModel)]="email" name="email"
            [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate">
        </div>
      </div>
      <div *ngIf="sent" class="success-alert">
        <i class="fa-solid fa-check-circle me-2"></i>{{ 'AUTH.EMAIL_SENT' | translate }}
      </div>
      <button type="submit" class="btn btn-primary btn-submit" [disabled]="isLoading || sent">
        <span class="spinner-border spinner-border-sm me-2" *ngIf="isLoading"></span>
        {{ (sent ? 'AUTH.SENT' : isLoading ? 'AUTH.SENDING' : 'AUTH.SEND_EMAIL') | translate }}
      </button>
    </form>
    <div class="auth-alt">
      <a routerLink="/auth/login">{{ 'AUTH.BACK_TO_LOGIN' | translate }}</a>
    </div>
  </div>
</div>
