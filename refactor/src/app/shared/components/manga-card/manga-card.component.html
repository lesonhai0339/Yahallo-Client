<a class="manga-card" [routerLink]="getRouterLink()">
  <div class="manga-card__image">
    <img [src]="manga.mangaImage" [alt]="manga.mangaName" appImageFallback loading="lazy">
    <div class="manga-card__overlay"></div>
    <span class="manga-card__status"
      [class.manga-card__status--completed]="manga.status"
      [class.manga-card__status--ongoing]="!manga.status">
      {{ (manga.status ? 'MANGA.STATUS_COMPLETED' : 'MANGA.STATUS_ONGOING') | translate }}
    </span>
    <div class="manga-card__chapter">
      <i class="fa-solid fa-book-open me-1" style="font-size:0.7rem"></i>{{ getLatestChapter() }}
    </div>
  </div>
  <div class="manga-card__info">
    <div class="manga-card__title" [title]="manga.mangaName">{{ manga.mangaName }}</div>
    <div class="manga-card__meta">
      <span><i class="fa-solid fa-eye me-1"></i>{{ formatViews(manga.view) }}</span>
      <span><i class="fa-solid fa-star me-1" style="color:#ffd700"></i>{{ manga.rating?.toFixed?.(1) ?? '—' }}</span>
    </div>
    <div class="manga-card__tags" *ngIf="showTags && manga.listcategory?.length">
      <span class="tag-chip" *ngFor="let cat of manga.listcategory | slice:0:3">{{ cat.genresIdName }}</span>
    </div>
  </div>
</a>
