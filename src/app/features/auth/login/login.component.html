<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a class="brand" routerLink="/">Yahallo</a>
      <h2>{{ 'AUTH.LOGIN_TITLE' | translate }}</h2>
      <p>{{ 'AUTH.LOGIN_SUBTITLE' | translate }}</p>
    </div>
    <form (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label>{{ 'AUTH.USERNAME' | translate }}</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user"></i>
          <input type="text" class="form-control" [(ngModel)]="username" name="username"
            [placeholder]="'AUTH.USERNAME_PLACEHOLDER' | translate" autocomplete="username">
        </div>
      </div>
      <div class="form-group">
        <label>{{ 'AUTH.PASSWORD' | translate }}</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" #pw="ngModel" required
            [(ngModel)]="password" name="password"
            [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | translate" autocomplete="current-password">
           <i [style.visibility]="pw.value?.length > 0 ? 'visible' : 'hidden'"
              [class]="!showPassword ? 'fa fa-eye' : 'fa fa-eye-slash'" 
              (click)="showPassword = !showPassword">
            </i>
        </div>
      </div>
      <div class="form-footer">
        <a routerLink="/auth/forgot-password" class="forgot-link">{{ 'AUTH.FORGOT_PASSWORD' | translate }}</a>
      </div>
      <button type="submit" class="btn btn-primary btn-submit" [disabled]="isLoading">
        <span class="spinner-border spinner-border-sm me-2" *ngIf="isLoading"></span>
        {{ (isLoading ? 'AUTH.LOGGING_IN' : 'AUTH.LOGIN_BTN') | translate }}
      </button>
    </form>
    <div class="auth-alt">
      {{ 'AUTH.NO_ACCOUNT' | translate }} <a routerLink="/auth/register">{{ 'AUTH.REGISTER_LINK' | translate }}</a>
    </div>
  </div>
</div>
