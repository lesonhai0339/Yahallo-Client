<div class="person-page">
  <div class="container-fluid px-3 px-md-4">

    <!-- Loading -->
    <div class="person-loading" *ngIf="isLoading">
      <i class="fa-solid fa-spinner fa-spin"></i>
    </div>

    <!-- Not found -->
    <div class="person-empty" *ngIf="!isLoading && notFound">
      <i class="fa-regular fa-face-frown"></i>
      <p>{{ 'PERSON.NOT_FOUND' | translate }}</p>
    </div>

    <app-entity-detail *ngIf="!isLoading && person"
      [kind]="kind"
      [name]="person.name"
      [description]="person.depscription"
      [birth]="person.birth"
      [lifeStatus]="person.lifeStatus"
      [mangas]="mangas"
      [isLoading]="isMangaLoading"
      [mockNotice]="isMangaMock">
    </app-entity-detail>

  </div>
</div>
