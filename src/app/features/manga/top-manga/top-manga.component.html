<div class="top-manga-page">
  <div class="top-manga-container">

    <h1 class="page-title">
      <i class="fa-solid fa-ranking-star me-2"></i>{{ 'TOP.TITLE' | translate }}
    </h1>

    <!-- Sort + View Controls -->
    <div class="controls-bar">
      <div class="sort-bar">
        <button *ngFor="let opt of sortOptions"
          class="sort-chip"
          [class.active]="activeSort.key === opt.key"
          (click)="setSort(opt)">
          <i [class]="opt.icon" class="me-1"></i>
          {{ opt.labelKey | translate }}
          <i class="sort-arrow fa-solid"
            *ngIf="activeSort.key === opt.key"
            [class.fa-arrow-down-short-wide]="opt.direction === 'desc'"
            [class.fa-arrow-up-short-wide]="opt.direction === 'asc'">
          </i>
        </button>
      </div>

      <div class="view-controls">
        <button class="sort-chip filter-toggle" [class.active]="showFilters" (click)="showFilters = !showFilters">
          <i class="fa-solid fa-filter me-1"></i>{{ 'TOP.FILTER' | translate }}
        </button>
        <div class="page-size-select">
          <select [ngModel]="pageSize" (ngModelChange)="setPageSize($event)">
            <option *ngFor="let size of pageSizeOptions" [ngValue]="size">{{ size }} / {{ 'TOP.PAGE' | translate }}</option>
          </select>
        </div>
        <div class="view-toggle">
          <button class="view-btn" [class.active]="viewMode === 'list'" (click)="setViewMode('list')"
            [title]="'TOP.VIEW_LIST' | translate">
            <i class="fa-solid fa-list"></i>
          </button>
          <button class="view-btn" [class.active]="viewMode === 'grid'" (click)="setViewMode('grid')"
            [title]="'TOP.VIEW_GRID' | translate">
            <i class="fa-solid fa-table-cells-large"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Filter Panel -->
    <div class="filter-panel" *ngIf="showFilters">
      <div class="filter-row" *ngIf="activeSort.key === 'totalViews' || activeSort.key === 'updateDate'">
        <label class="filter-label"><i class="fa-regular fa-calendar me-1"></i>{{ 'TOP.DATE_RANGE' | translate }}</label>
        <div class="filter-inputs">
          <input type="date" class="filter-date" [(ngModel)]="filterDateFrom" (change)="applyFilters()">
          <span class="filter-separator">—</span>
          <input type="date" class="filter-date" [(ngModel)]="filterDateTo" (change)="applyFilters()">
        </div>
      </div>

      <div class="filter-row" *ngIf="activeSort.key === 'averageRating'">
        <label class="filter-label"><i class="fa-solid fa-star me-1"></i>{{ 'TOP.RATING_RANGE' | translate }}</label>
        <div class="filter-inputs">
          <span class="filter-value">{{ filterRatingMin }}</span>
          <input type="range" class="filter-range" min="0" max="10" step="0.5"
            [(ngModel)]="filterRatingMin" (ngModelChange)="applyFilters()">
          <span class="filter-separator">—</span>
          <input type="range" class="filter-range" min="0" max="10" step="0.5"
            [(ngModel)]="filterRatingMax" (ngModelChange)="applyFilters()">
          <span class="filter-value">{{ filterRatingMax }}</span>
        </div>
      </div>

      <button class="filter-clear-btn" (click)="clearFilters()">
        <i class="fa-solid fa-xmark me-1"></i>{{ 'TOP.CLEAR_FILTER' | translate }}
      </button>
    </div>

    <!-- Loading -->
    <app-loading-skeleton *ngIf="isLoading" [count]="pageSize" [cols]="6"></app-loading-skeleton>

    <!-- List View -->
    <div class="manga-list" *ngIf="!isLoading && viewMode === 'list'">
      <a class="manga-row" *ngFor="let manga of sortedList; let i = index"
         [routerLink]="['/manga', manga.id]">

        <span class="manga-row__rank"
          [class.gold]="getRank(i) === 1"
          [class.silver]="getRank(i) === 2"
          [class.bronze]="getRank(i) === 3">
          {{ getRank(i) }}
        </span>

        <img class="manga-row__thumb" [src]="manga.mangaThumbnail" [alt]="manga.displayName" appImageFallback loading="lazy">

        <div class="manga-row__info">
          <div class="manga-row__name">{{ manga.displayName }}</div>
          <div class="manga-row__tags" *ngIf="manga.tags?.length">
            <button class="row-tag row-tag--link" *ngFor="let t of manga.tags | slice:0:3"
              (click)="goToTag($event, t.id)">{{ t.name }}</button>
          </div>
        </div>

        <div class="manga-row__stats">
          <span class="stat" [title]="'TOP.VIEWS' | translate">
            <i class="fa-solid fa-eye"></i>{{ formatViews(manga.totalViews) }}
          </span>
          <span class="stat" [title]="'TOP.RATING' | translate">
            <i class="fa-solid fa-star" style="color:#ffd700"></i>{{ manga.averageRating?.toFixed?.(1) ?? '—' }}
          </span>
          <span class="stat" [title]="'TOP.CHAPTERS' | translate">
            <i class="fa-solid fa-book"></i>{{ manga.totalChapters ?? 0 }}
          </span>
          <span class="stat stat--update" [title]="'TOP.UPDATED' | translate">
            <i class="fa-solid fa-clock-rotate-left"></i>{{ manga.lastestChapter?.createDate | date:'dd/MM/yyyy' }}
          </span>
        </div>
      </a>
    </div>

    <!-- Grid View -->
    <div class="manga-grid" *ngIf="!isLoading && viewMode === 'grid'">
      <app-manga-sumary-card *ngFor="let manga of sortedList" [manga]="manga" [showTags]="true"></app-manga-sumary-card>
    </div>

    <!-- Pagination -->
    <app-pagination *ngIf="!isLoading"
      [currentPage]="currentPage" [totalCount]="totalCount" [pageSize]="pageSize"
      (pageChange)="goToPage($event)"></app-pagination>

  </div>
</div>
