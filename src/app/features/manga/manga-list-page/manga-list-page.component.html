<div class="list-page">
  <div class="container-fluid px-3 px-md-4">

    <h1 class="page-title">
      <i [class]="icon" class="me-2"></i>{{ titleKey | translate }}
    </h1>

    <!-- View Controls -->
    <div class="controls-bar">
      <div class="view-controls">
        <div class="sort-toggle">
          <button class="sort-btn" [class.active]="sortDescending" (click)="setSortDirection(true)">
            <i class="fa-solid fa-arrow-down-wide-short"></i>{{ 'TOP.SORT_NEWEST' | translate }}
          </button>
          <button class="sort-btn" [class.active]="!sortDescending" (click)="setSortDirection(false)">
            <i class="fa-solid fa-arrow-up-wide-short"></i>{{ 'TOP.SORT_OLDEST' | translate }}
          </button>
        </div>
        <div class="page-size-select">
          <select [ngModel]="pageSize" (ngModelChange)="setPageSize($event)">
            <option *ngFor="let size of pageSizeOptions" [ngValue]="size">{{ size }} / {{ 'TOP.PAGE' | translate }}</option>
          </select>
        </div>
        <div class="view-toggle">
          <button class="view-btn" [class.active]="viewMode === 'list'" (click)="setViewMode('list')"
            [title]="'TOP.VIEW_LIST' | translate">
            <i class="fa-solid fa-list"></i>
          </button>
          <button class="view-btn" [class.active]="viewMode === 'grid'" (click)="setViewMode('grid')"
            [title]="'TOP.VIEW_GRID' | translate">
            <i class="fa-solid fa-table-cells-large"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div class="page-loading" *ngIf="isLoading">
      <div class="spinner-border" style="color:var(--accent-primary)"></div>
    </div>

    <!-- List View -->
    <div class="manga-list" *ngIf="!isLoading && viewMode === 'list'">
      <a class="manga-row" *ngFor="let manga of displayList"
         [routerLink]="['/manga', manga.id]">

        <img class="manga-row__thumb" [src]="manga.mangaThumbnail" [alt]="manga.name" appImageFallback loading="lazy">

        <div class="manga-row__info">
          <div class="manga-row__name">{{ manga.name }}</div>
          <div class="manga-row__tags" *ngIf="manga.tags?.length">
            <button class="row-tag row-tag--link" *ngFor="let t of manga.tags | slice:0:3"
              (click)="goToTag($event, t.id)">{{ t.name }}</button>
          </div>
        </div>

        <div class="manga-row__stats">
          <span class="stat" [title]="'TOP.VIEWS' | translate">
            <i class="fa-solid fa-eye"></i>{{ formatViews(manga.totalViews) }}
          </span>
          <span class="stat" [title]="'TOP.RATING' | translate">
            <i class="fa-solid fa-star" style="color:#ffd700"></i>{{ manga.averageRating ? manga.averageRating.toFixed(1) : 'N/A' }}
          </span>
          <span class="stat stat--update" [title]="'TOP.UPDATED' | translate" *ngIf="manga.lastChapterUpdate">
            <i class="fa-solid fa-clock-rotate-left"></i>{{ manga.lastChapterUpdate | date:'dd/MM/yyyy' }}
          </span>
        </div>
      </a>
    </div>

    <!-- Grid View -->
    <div class="manga-grid" *ngIf="!isLoading && viewMode === 'grid'">
      <app-manga-sumary-card *ngFor="let manga of displayList" [manga]="manga"></app-manga-sumary-card>
    </div>

    <!-- Pagination -->
    <app-pagination *ngIf="!isLoading"
      [currentPage]="currentPage" [totalCount]="totalCount" [pageSize]="pageSize"
      (pageChange)="goToPage($event)"></app-pagination>

  </div>
</div>
