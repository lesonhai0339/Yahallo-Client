<div class="reader-page">

  <!-- Top Bar -->
  <div class="reader-topbar" [class.visible]="isMenuVisible">
    <div class="reader-topbar-inner">
      <a class="back-btn" [routerLink]="['/manga', mangaId, currentChapter?.mangaName ?? '']">
        <i class="fa-solid fa-arrow-left me-2"></i>{{ 'READER.BACK' | translate }}
      </a>
      <div class="chapter-select-wrapper">
        <select class="form-select form-select-sm"
          (change)="goToChapter(chapters[$any($event.target).selectedIndex])"
          [value]="chapterId">
          <option *ngFor="let ch of chapters" [value]="ch.chapterId">{{ ch.chapterName }}</option>
        </select>
      </div>
      <div class="chapter-nav">
        <button class="btn btn-secondary btn-sm" (click)="prevChapter()"
          [disabled]="currentChapterIndex <= 0" [title]="'READER.PREV_CHAPTER' | translate">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="btn btn-secondary btn-sm" (click)="nextChapter()"
          [disabled]="currentChapterIndex >= chapters.length-1" [title]="'READER.NEXT_CHAPTER' | translate">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Images -->
  <div class="reader-content" *ngIf="!isLoading">
    <img *ngFor="let img of images; let i = index"
      [src]="img.imageUrl ?? img.imageurl ?? img"
      [alt]="'READER.PAGE' | translate"
      appImageFallback
      class="reader-img"
      loading="lazy"
      (load)="saveProgress(i)">
  </div>

  <div class="reader-loading" *ngIf="isLoading">
    <div class="spinner-border" style="color:var(--accent-primary)"></div>
  </div>

  <!-- Bottom Bar -->
  <div class="reader-bottombar" [class.visible]="isMenuVisible">
    <button class="btn btn-secondary" (click)="prevChapter()" [disabled]="currentChapterIndex <= 0">
      <i class="fa-solid fa-chevron-left me-2"></i>{{ 'READER.PREV_CHAPTER' | translate }}
    </button>
    <span class="chapter-label">{{ currentChapter?.chapterName }}</span>
    <button class="btn btn-secondary" (click)="nextChapter()" [disabled]="currentChapterIndex >= chapters.length-1">
      {{ 'READER.NEXT_CHAPTER' | translate }}<i class="fa-solid fa-chevron-right ms-2"></i>
    </button>
  </div>

  <!-- Chapter Comments -->
  <div class="reader-comments" *ngIf="!isLoading">
    <div class="container">
      <app-comment-section [mangaId]="mangaId" [chapterId]="chapterId"></app-comment-section>
    </div>
  </div>

</div>
