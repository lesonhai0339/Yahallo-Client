<div class="reader-page" [class.focus-mode]="settings.mode === 'focus'">

  <!-- Resume reading prompt (read-progress mode = 'ask') -->
  <div class="resume-overlay" *ngIf="showResumePrompt" (click)="dismissResume()">
    <div class="resume-dialog" (click)="$event.stopPropagation()">
      <i class="fa-solid fa-bookmark resume-dialog__icon"></i>
      <h3>Tiếp tục đọc?</h3>
      <p>Bạn đang đọc dở bộ này ở trang {{ (resumeTarget?.imageIndex ?? 0) + 1 }}. Tiếp tục từ đó?</p>
      <div class="resume-dialog__actions">
        <button class="resume-btn resume-btn--ghost" (click)="startFromBeginning()">Đọc từ đầu</button>
        <button class="resume-btn resume-btn--primary" (click)="resumeReading()">Đọc tiếp</button>
      </div>
    </div>
  </div>

  <!-- Settings Sidebar -->
  <div class="reader-sidebar-overlay" *ngIf="isSidebarOpen" (click)="closeSidebar()"></div>
  <div class="reader-sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-header">
      <span>{{ 'READER.SETTINGS' | translate }}</span>
      <button class="btn-close-sidebar" (click)="closeSidebar()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="sidebar-content">
      <a class="sidebar-back-btn" [routerLink]="['/manga', mangaId]" (click)="closeSidebar()">
        <i class="fa-solid fa-book me-2"></i>{{ 'READER.BACK_TO_DETAIL' | translate }}
      </a>

      <div class="sidebar-divider"></div>

      <div class="setting-group">
        <label class="setting-label">{{ 'READER.DIRECTION' | translate }}</label>
        <div class="setting-options">
          <button class="option-btn" [class.active]="pendingSettings.direction === 'vertical'"
            (click)="pendingSettings.direction = 'vertical'">
            <i class="fa-solid fa-arrows-up-down me-1"></i>{{ 'READER.VERTICAL' | translate }}
          </button>
          <button class="option-btn" [class.active]="pendingSettings.direction === 'horizontal'"
            (click)="pendingSettings.direction = 'horizontal'">
            <i class="fa-solid fa-arrows-left-right me-1"></i>{{ 'READER.HORIZONTAL' | translate }}
          </button>
        </div>
      </div>

      <div class="setting-group" *ngIf="pendingSettings.direction === 'horizontal'">
        <label class="setting-label">{{ 'READER.HORIZONTAL_DIR' | translate }}</label>
        <div class="setting-options">
          <button class="option-btn" [class.active]="pendingSettings.horizontalDir === 'rtl'"
            (click)="pendingSettings.horizontalDir = 'rtl'">
            <i class="fa-solid fa-arrow-right-to-bracket fa-flip-horizontal me-1"></i>{{ 'READER.RTL' | translate }}
          </button>
          <button class="option-btn" [class.active]="pendingSettings.horizontalDir === 'ltr'"
            (click)="pendingSettings.horizontalDir = 'ltr'">
            <i class="fa-solid fa-arrow-right-to-bracket me-1"></i>{{ 'READER.LTR' | translate }}
          </button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">{{ 'READER.MODE' | translate }}</label>
        <div class="setting-options">
          <button class="option-btn" [class.active]="pendingSettings.mode === 'normal'"
            (click)="pendingSettings.mode = 'normal'">
            <i class="fa-solid fa-expand me-1"></i>{{ 'READER.MODE_NORMAL' | translate }}
          </button>
          <button class="option-btn" [class.active]="pendingSettings.mode === 'focus'"
            (click)="pendingSettings.mode = 'focus'">
            <i class="fa-solid fa-compress me-1"></i>{{ 'READER.MODE_FOCUS' | translate }}
          </button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          {{ 'READER.IMAGE_SIZE' | translate }}
          <span class="setting-value">{{ pendingSettings.imageSize }}%</span>
        </label>
        <input type="range" class="form-range" min="50" max="150" step="5"
          [(ngModel)]="pendingSettings.imageSize" [ngModelOptions]="{ standalone: true }">
        <div class="range-labels">
          <span>50%</span>
          <span>100%</span>
          <span>150%</span>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          {{ 'READER.PRELOAD_COUNT' | translate }}
          <span class="setting-value">{{ pendingSettings.preloadCount }}</span>
        </label>
        <input type="range" class="form-range" min="1" max="10" step="1"
          [(ngModel)]="pendingSettings.preloadCount" [ngModelOptions]="{ standalone: true }">
        <div class="range-labels">
          <span>1</span>
          <span>5</span>
          <span>10</span>
        </div>
      </div>

    </div>

    <div class="sidebar-footer">
      <button class="apply-btn" (click)="applySettings()">
        <i class="fa-solid fa-check me-1"></i>{{ 'READER.APPLY' | translate }}
      </button>
    </div>
  </div>

  <!-- Reader Viewer -->
  <app-reader-viewer *ngIf="!isLoading"
    [images]="images"
    [initialPage]="initialPage"
    [direction]="settings.direction"
    [horizontalDir]="settings.horizontalDir"
    [imageSize]="settings.imageSize"
    [preloadCount]="settings.preloadCount"
    (pageChange)="onPageChange($event)">
  </app-reader-viewer>

  <div class="reader-loading" *ngIf="isLoading">
    <div class="spinner-border" style="color:var(--accent-primary)"></div>
  </div>

  <!-- Bottom Bar — floating left on desktop, full-width on mobile -->
  <div class="reader-bottombar" [class.visible]="isBottombarVisible">

    <!-- Chapter list dropdown -->
    <div class="chapter-list-overlay" *ngIf="isChapterListOpen" (click)="closeChapterList()"></div>
    <div class="chapter-list-dropdown" [class.open]="isChapterListOpen">
      <div class="chapter-list-scroll">
        <button *ngFor="let ch of chapters.slice().reverse(); let i = index"
          class="chapter-list-item"
          [class.active]="ch.id === chapterId"
          (mousedown)="selectChapter(ch)">
          <span class="chapter-list-item__title">{{ ch.title }}</span>
          <i class="fa-solid fa-check" *ngIf="ch.id === chapterId"></i>
        </button>
      </div>
    </div>

    <div class="bottombar-buttons">
      <button class="bb-btn" (click)="prevChapter()"
        [disabled]="currentChapterIndex <= 0"
        [title]="'READER.PREV_CHAPTER' | translate">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <a class="bb-btn" [routerLink]="['/manga', mangaId]"
        [title]="'READER.BACK_TO_DETAIL' | translate">
        <i class="fa-solid fa-house"></i>
      </a>
      <button class="bb-btn bb-btn--chapter" (click)="toggleChapterList()"
        [title]="currentChapter?.title">
        <i class="fa-solid fa-list me-1"></i>
        <span class="bb-chapter-label">{{ currentChapter?.title }}</span>
      </button>
      <button class="bb-btn" (click)="toggleSidebar()"
        [title]="'READER.SETTINGS' | translate">
        <i class="fa-solid fa-sliders"></i>
      </button>
      <button class="bb-btn" (click)="nextChapter()"
        [disabled]="currentChapterIndex >= chapters.length - 1"
        [title]="'READER.NEXT_CHAPTER' | translate">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- Chapter Comments -->
  <div class="reader-comments" *ngIf="!isLoading && settings.mode !== 'focus'">
    <div class="container">
      <app-comment-section [mangaId]="mangaId" [chapterId]="chapterId"></app-comment-section>
    </div>
  </div>

</div>
