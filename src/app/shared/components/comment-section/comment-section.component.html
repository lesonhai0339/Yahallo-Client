<section class="comment-section">

  <!-- Header -->
  <div class="section-header comment-section-header">
    <h3 class="section-title">
      <i class="fa-regular fa-comments me-2"></i>
      {{ 'COMMENT.TITLE' | translate }}
      <span class="count-badge" *ngIf="totalCount">{{ totalCount }}</span>
    </h3>
  </div>

  <!-- Top editor -->
  <div class="top-editor-wrap" *ngIf="currentUser; else loginPrompt">
    <div class="editor-user-row">
      <app-avatar-frame [src]="currentUser.avatar || '/assets/user.jpg'"
        [alt]="currentUser.name"
        fallback="/assets/user.jpg"
        [size]="38"></app-avatar-frame>
    </div>
    <app-comment-editor
      #topEditor
      [placeholder]="'COMMENT.PLACEHOLDER' | translate"
      (submitted)="submitComment($event)">
    </app-comment-editor>
  </div>

  <ng-template #loginPrompt>
    <div class="login-prompt">
      <i class="fa-regular fa-comment-dots me-2"></i>
      <a routerLink="/auth/login">{{ 'AUTH.LOGIN_BTN' | translate }}</a>
      {{ 'COMMENT.LOGIN_TO_COMMENT' | translate }}
    </div>
  </ng-template>

  <!-- Loading -->
  <div class="comments-loading" *ngIf="loading">
    <div class="skeleton-comment" *ngFor="let i of [1,2,3]">
      <div class="skeleton skeleton-avatar"></div>
      <div class="skeleton-lines">
        <div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line medium"></div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty-comments" *ngIf="!loading && comments.length === 0">
    <i class="fa-regular fa-comment fa-2x mb-2"></i>
    <p>{{ 'COMMENT.EMPTY' | translate }}</p>
  </div>

  <!-- Comment list -->
  <div class="comments-list" *ngIf="!loading && comments.length > 0">
    <app-comment-item
      *ngFor="let c of comments"
      [comment]="c",
      [mangaId]="mangaId",
      [chapterId]="chapterId",
      [showChapterLabel]="!!chapterId === false"
      (quoteRequest)="onQuoteRequest($event)">
    </app-comment-item>
  </div>

  <!-- Pagination controls -->
  <div class="comment-controls" *ngIf="!loading && totalCount > 0">
    <div class="comment-page-size">
      <select [ngModel]="pageSize" (ngModelChange)="setPageSize($event)">
        <option *ngFor="let size of pageSizeOptions" [ngValue]="size">{{ size }} / {{ 'COMMENT.PAGE' | translate }}</option>
      </select>
    </div>

    <app-pagination [currentPage]="currentPage" [totalCount]="totalCount" [pageSize]="pageSize"
      (pageChange)="goToPage($event)"></app-pagination>
  </div>

</section>
