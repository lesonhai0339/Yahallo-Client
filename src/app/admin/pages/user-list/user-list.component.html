<div class="user-list-page">
  <div class="page-header">
    <div>
      <h1>Quản lý Users</h1>
      <p>{{ totalCount | number }} người dùng</p>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar__search">
      <span class="material-icons toolbar__search-icon">search</span>
      <input class="toolbar__search-input" placeholder="Tìm theo tên, email..." (keyup)="applyFilter($event)" />
    </div>
  </div>

  <div class="table-wrapper">
    <div *ngIf="loading" class="table-loading">
      <div class="spinner"></div><span>Đang tải...</span>
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="admin-table" [class.loading]="loading">

      <!-- Avatar -->
      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef>Avatar</th>
        <td mat-cell *matCellDef="let u">
          <img *ngIf="u.avatarUrl" [src]="u.avatarUrl" [alt]="u.name" class="user-avatar" />
          <div *ngIf="!u.avatarUrl" class="user-avatar user-avatar--initials">{{ getInitials(u.name) }}</div>
        </td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tên</th>
        <td mat-cell *matCellDef="let u">
          <div class="user-name">{{ u.name ?? u.userName ?? '—' }}</div>
          <div class="user-id">ID: {{ u.id | slice:0:8 }}...</div>
        </td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email ?? '—' }}</td>
      </ng-container>

      <!-- Roles -->
      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Roles</th>
        <td mat-cell *matCellDef="let u">
          <span class="role-chip" *ngFor="let r of (u.roleList ?? [])">{{ r }}</span>
          <span class="no-roles" *ngIf="!(u.roleList?.length)">—</span>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Thao tác</th>
        <td mat-cell *matCellDef="let u">
          <div class="action-btns">
            <button class="action-btn action-btn--role" (click)="openRoleDialog(u)" title="Quản lý role">
              <span class="material-icons">manage_accounts</span>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">Không có người dùng nào</td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
</div>
