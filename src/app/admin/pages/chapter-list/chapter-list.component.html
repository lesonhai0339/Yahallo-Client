<div class="chapter-list-page">
  <div class="page-header">
    <button class="btn-back" (click)="goBack()">
      <span class="material-icons">arrow_back</span>
    </button>
    <div>
      <h1>Quản lý Chương</h1>
      <p>Manga ID: {{ mangaId | slice:0:8 }}... | {{ totalCount }} chương</p>
    </div>
    <button class="btn btn-primary" (click)="openAddDialog()">
      <span class="material-icons">add</span> Thêm chương
    </button>
  </div>

  <div class="toolbar">
    <div class="toolbar__search">
      <span class="material-icons toolbar__search-icon">search</span>
      <input class="toolbar__search-input" placeholder="Tìm theo tiêu đề..." (keyup)="applyFilter($event)" />
    </div>
  </div>

  <div class="table-wrapper">
    <div *ngIf="loading" class="table-loading">
      <div class="spinner"></div><span>Đang tải...</span>
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="admin-table" [class.loading]="loading">

      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
        <td mat-cell *matCellDef="let c">
          <span class="chapter-index">Ch. {{ c.index }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tiêu đề</th>
        <td mat-cell *matCellDef="let c">{{ c.title || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="chapterDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ngày đăng</th>
        <td mat-cell *matCellDef="let c">{{ c.chapterDate ? (c.chapterDate | date:'dd/MM/yyyy') : '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Thao tác</th>
        <td mat-cell *matCellDef="let c">
          <div class="action-btns">
            <button class="action-btn action-btn--edit" (click)="openEditDialog(c)" title="Chỉnh sửa">
              <span class="material-icons">edit</span>
            </button>
            <button class="action-btn action-btn--delete" (click)="deleteChapter(c)" title="Xóa">
              <span class="material-icons">delete</span>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
          Chưa có chương nào
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="[20, 50, 100]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
</div>
