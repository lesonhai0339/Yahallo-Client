<div class="admin-wrapper" [class.sidebar-closed]="!sidebarOpen">

  <!-- Mobile backdrop: tap to close the overlay sidebar -->
  <div class="admin-backdrop" (click)="closeSidebar()"></div>


  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">
      <span class="admin-sidebar__logo-icon">⚙</span>
      <span class="admin-sidebar__logo-text">Admin Panel</span>
      <button class="admin-sidebar__close" (click)="closeSidebar()" title="Đóng menu">
        <span class="material-icons">close</span>
      </button>
    </div>

    <nav class="admin-sidebar__nav">
      <a
        *ngFor="let item of visibleNavItems"
        class="admin-sidebar__nav-item"
        [class.active]="isActive(item.path)"
        [routerLink]="item.path"
        (click)="onNavClick()">
        <span class="material-icons admin-sidebar__icon">{{ item.icon }}</span>
        <span class="admin-sidebar__label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="admin-sidebar__footer">
      <a class="admin-sidebar__nav-item" routerLink="/" title="Về trang chủ">
        <span class="material-icons admin-sidebar__icon">home</span>
        <span class="admin-sidebar__label">Trang chủ</span>
      </a>
      <button class="admin-sidebar__nav-item admin-sidebar__logout" (click)="logout()">
        <span class="material-icons admin-sidebar__icon">logout</span>
        <span class="admin-sidebar__label">Đăng xuất</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="admin-main">
    <!-- Top header -->
    <header class="admin-header">
      <button class="admin-header__toggle" (click)="toggleSidebar()" title="Toggle sidebar">
        <span class="material-icons">menu</span>
      </button>

      <div class="admin-header__right">
        <!-- View-as switcher (Admin only) -->
        <div class="view-as" *ngIf="perm.isRealAdmin">
          <button class="view-as__trigger" (click)="toggleViewAsSwitcher()"
            [class.view-as__trigger--active]="perm.isViewingAs">
            <span class="material-icons">swap_horiz</span>
            <span class="view-as__label">
              {{ perm.isViewingAs ? 'Xem như: ' + perm.getRoleLabel() : 'Chuyển view' }}
            </span>
          </button>
          <div class="view-as__dropdown" *ngIf="showViewAsSwitcher">
            <button
              *ngFor="let opt of viewAsOptions"
              class="view-as__option"
              [class.active]="(!perm.isViewingAs && !opt.role) || (perm.viewingAsRole === opt.role)"
              (mousedown)="switchViewAs(opt.role)">
              {{ opt.label }}
              <span class="material-icons view-as__check" *ngIf="(!perm.isViewingAs && !opt.role) || (perm.viewingAsRole === opt.role)">check</span>
            </button>
          </div>
        </div>

        <div class="admin-header__user" *ngIf="currentUser">
          <span class="role-badge" [ngClass]="perm.getRoleBadgeClass()">
            {{ perm.getRoleLabel() }}
            <span *ngIf="perm.isViewingAs" class="role-badge__preview">(preview)</span>
          </span>
          <img
            [src]="currentUser.avatar || '/assets/user.jpg'"
            [alt]="currentUser.name"
            class="admin-header__avatar" />
          <span class="admin-header__username">{{ currentUser.name }}</span>
        </div>
      </div>
    </header>

    <!-- View-as banner -->
    <div class="view-as-banner" *ngIf="perm.isViewingAs">
      <span class="material-icons">info</span>
      Đang xem như <strong>{{ perm.getRoleLabel() }}</strong> — giao diện và quyền hiển thị theo role này
      <button class="view-as-banner__reset" (click)="switchViewAs(null)">
        <span class="material-icons">close</span> Tắt
      </button>
    </div>

    <!-- Page content -->
    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
